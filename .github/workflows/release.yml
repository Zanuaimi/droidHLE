name: Build droidHLE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/.android-ndk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute next release tag
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libboost-dev openjdk-17-jdk-headless

      - name: Install Android NDK r29
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q ndk.zip
          mv android-ndk-r29 "$ANDROID_NDK_HOME"

      - name: Restore arm32 sysroot
        uses: actions/cache@v4
        with:
          path: sysroot
          key: arm32-sysroot-${{ hashFiles('tools/extract_sysroot.sh') }}

      - name: Check arm32 sysroot
        run: |
          if [ ! -f sysroot/system/lib/libc.so ]; then
            echo "sysroot/ is missing. Run tools/extract_sysroot.sh from an AOSP GSI, then cache it under the key above." >&2
            exit 1
          fi

      - name: Build Android core
        run: |
          mkdir -p build/boost-headers
          ln -sfn /usr/include/boost build/boost-headers/boost
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DZB_BUILD_TESTS=OFF \
            -DBoost_INCLUDE_DIR="$PWD/build/boost-headers"
          ninja -C build/android-arm64 zbridge zbproxy

      - name: Build arm32 guest
        env:
          NDK: ${{ env.ANDROID_NDK_HOME }}
        run: tools/build_guest.sh

      - name: Build launcher bundle
        run: tools/make_launcher_bundle.sh

      - name: Write release signing config
        env:
          SIGNING_STORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_B64" ]; then
            echo "No signing secrets set; the release APK stays unsigned."
            exit 0
          fi
          mkdir -p "$HOME/.zettabridge"
          echo "$SIGNING_STORE_B64" | base64 -d > "$HOME/.zettabridge/release.keystore"
          {
            echo "storeFile=$HOME/.zettabridge/release.keystore"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$HOME/.zettabridge/signing.properties"

      - name: Build release APK
        working-directory: android/launcher
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk=$(find android/launcher/app/build/outputs/apk/release -name 'droidHLE-*.apk' | head -n 1)
          mv "$apk" "droidHLE-${TAG}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "droidHLE-${TAG}.apk" \
            --target "$GITHUB_SHA" --title "droidHLE $TAG" --generate-notes
